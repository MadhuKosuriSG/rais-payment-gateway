│  └──────────────────────────────────────────┘  │
└──────┬──────────────────────────────────────────┘
       │ 2. POST /payments/:id/create_order
       ▼
┌─────────────────────────────────────────────────┐
│              Rails API Backend                  │
│  ┌──────────────────────────────────────────┐  │
│  │ Create Razorpay Order                    │  │
│  │ Store razorpay_order_id                  │  │
│  │ Update status: initiated                 │  │
│  └──────────────────────────────────────────┘  │
└──────┬──────────────────────────────────────────┘
       │ 3. Return order_id + key_id
       ▼
┌─────────────┐
│   Frontend  │ 4. Open Razorpay Checkout
│             │    (User enters card details)
└──────┬──────┘
       │
       ▼
┌─────────────────────────────────────────────────┐
│            Razorpay Gateway                     │
│  - Processes payment                            │
│  - Captures money                               │
└──────┬──────────────────────────────────────────┘
       │
       │ 5. Webhook: payment.captured
       ▼
┌─────────────────────────────────────────────────┐
│       POST /webhooks/razorpay                   │
│  ┌──────────────────────────────────────────┐  │
│  │ Verify signature                         │  │
│  │ Store webhook_event (idempotent)         │  │
│  │ Create gateway_transaction               │  │
│  │ Update payment_attempt → captured        │  │
│  │ Update payment → captured                │  │
│  └──────────────────────────────────────────┘  │
└─────────────────────────────────────────────────┘
       │
       │ 6. Frontend polls GET /payments/:id
       ▼
┌─────────────┐
│   Frontend  │ Shows success message
