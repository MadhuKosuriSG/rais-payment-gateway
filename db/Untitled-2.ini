

┌─────────────┐
│   Frontend  │
│  (React)    │
└──────┬──────┘
       │ 1. POST /payments (amount + idempotency_key)
       ▼
┌─────────────────────────────────────────────────┐
│              Rails API Backend                  │
│  ┌──────────────────────────────────────────┐  │
│  │ Create Payment Record (status: created)  │  │
