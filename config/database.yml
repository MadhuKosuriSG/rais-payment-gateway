# MySQL. Versions 5.5.8 and up are supported.
#
# Install the MySQL driver
#   gem install mysql2
#
# Ensure the MySQL gem is defined in your Gemfile
#   gem 'mysql2'
#
# And be sure to use new-style password hashing:
#   https://dev.mysql.com/doc/refman/5.7/en/password-hashing.html
#

# DEVELOPMENT - Uses Unix socket for local MySQL
development:
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  database: rais_payment_gateway_development
  username: root
  password:
  socket: /tmp/mysql.sock

# TEST - Uses Unix socket for local MySQL
test:
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  database: rais_payment_gateway_test
  username: root
  password:
  socket: /tmp/mysql.sock

# STAGING - Uses TCP/IP connection with environment variables
staging:
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  database: <%= ENV.fetch("DATABASE_NAME") { "rais_payment_gateway_staging" } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { "rais_payment_gateway" } %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DATABASE_PORT") { 3306 } %>
  reconnect: true
  connect_timeout: 5
  read_timeout: 5
  write_timeout: 5

# PRODUCTION - Uses TCP/IP connection with environment variables
production:
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  database: <%= ENV.fetch("DATABASE_NAME") { "rais_payment_gateway_production" } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { "rais_payment_gateway" } %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DATABASE_PORT") { 3306 } %>
  reconnect: true
  connect_timeout: 5
  read_timeout: 5
  write_timeout: 5

